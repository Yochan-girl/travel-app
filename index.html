<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Yochan Travel Map</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

</head>


<body>

  <div class="container">


    <!-- タイトル -->
    <header class="page-header">

      <h1>Yochan Travel Map</h1>

    </header>


    <!-- 世界地図 -->
    <section class="section-card">

      <h2>Countries Visited</h2>

      <div id="map"></div>

    </section>


    <!-- 旅行の記録 -->
    <section class="section-card">

      <h2>Travel Memories</h2>


      <h3 id="selected-country">
        Select a country on the map
      </h3>


      <!-- 訪問日 -->
      <div class="date-grid">


        <div class="field">

          <p>Visit Date 1</p>

          <input
            type="date"
            id="visitDate1"
          >

        </div>


        <div class="field">

          <p>Visit Date 2</p>

          <input
            type="date"
            id="visitDate2"
          >

        </div>


        <div class="field">

          <p>Visit Date 3</p>

          <input
            type="date"
            id="visitDate3"
          >

        </div>


        <div class="field">

          <p>Visit Date 4</p>

          <input
            type="date"
            id="visitDate4"
          >

        </div>


        <div class="field">

          <p>Visit Date 5</p>

          <input
            type="date"
            id="visitDate5"
          >

        </div>


      </div>


      <!-- Food -->
      <div class="text-field">

        <h3>Food</h3>

        <textarea
          id="food"
          maxlength="800"
        ></textarea>

      </div>


      <!-- Memory -->
      <div class="text-field">

        <h3>Memory</h3>

        <textarea
          id="memory"
          maxlength="800"
        ></textarea>

      </div>


      <!-- Memo -->
      <div class="text-field">

        <h3>Memo</h3>

        <textarea
          id="memo"
          maxlength="800"
        ></textarea>

      </div>


      <!-- 保存ボタン -->
      <button id="saveButton">
        保存
      </button>


    </section>


  </div>


  <script src="app.js"></script>

</body>

</html>

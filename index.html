<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Yochan Travel Map</title>


  <!-- 自分のCSS -->
  <link
    rel="stylesheet"
    href="style.css"
  >


  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  >


  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <!-- Leaflet JavaScript -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

</head>


<body>

  <div class="container">


    <!-- =========================
         タイトル
    ========================== -->

    <header class="page-header">

      <h1>Yochan Travel Map</h1>

    </header>



    <!-- =========================
         世界地図
    ========================== -->

    <section class="section-card">

      <h2>
        <i class="bi bi-geo-alt-fill"></i>
        Countries Visited
      </h2>

      <div id="map"></div>

    </section>



    <!-- =========================
         旅行の記録
    ========================== -->

    <section class="section-card">

      <h2>
        <i class="bi bi-journal-text"></i>
        Travel Memories
      </h2>


      <!-- 選択中の国 -->

      <h3 id="selected-country">

        <i class="bi bi-geo-alt-fill"></i>

        Select a country on the map

      </h3>



      <!-- =========================
           Visit 1
      ========================== -->

      <div class="date-grid">


        <div class="field visit-set">

          <p>
            <i class="bi bi-calendar3"></i>
            Visit Date 1
          </p>

          <input
            type="date"
            id="visitDate1"
          >


          <p class="city-label">
            <i class="bi bi-geo-alt"></i>
            Visit City 1
          </p>

          <input
            type="text"
            id="visitCity1"
            placeholder="例：Paris"
            maxlength="100"
          >

        </div>



        <!-- =========================
             Visit 2
        ========================== -->

        <div class="field visit-set">

          <p>
            <i class="bi bi-calendar3"></i>
            Visit Date 2
          </p>

          <input
            type="date"
            id="visitDate2"
          >


          <p class="city-label">
            <i class="bi bi-geo-alt"></i>
            Visit City 2
          </p>

          <input
            type="text"
            id="visitCity2"
            placeholder="例：London"
            maxlength="100"
          >

        </div>



        <!-- =========================
             Visit 3
        ========================== -->

        <div class="field visit-set">

          <p>
            <i class="bi bi-calendar3"></i>
            Visit Date 3
          </p>

          <input
            type="date"
            id="visitDate3"
          >


          <p class="city-label">
            <i class="bi bi-geo-alt"></i>
            Visit City 3
          </p>

          <input
            type="text"
            id="visitCity3"
            placeholder="例：Rome"
            maxlength="100"
          >

        </div>



        <!-- =========================
             Visit 4
        ========================== -->

        <div class="field visit-set">

          <p>
            <i class="bi bi-calendar3"></i>
            Visit Date 4
          </p>

          <input
            type="date"
            id="visitDate4"
          >


          <p class="city-label">
            <i class="bi bi-geo-alt"></i>
            Visit City 4
          </p>

          <input
            type="text"
            id="visitCity4"
            placeholder="例：Seoul"
            maxlength="100"
          >

        </div>



        <!-- =========================
             Visit 5
        ========================== -->

        <div class="field visit-set">

          <p>
            <i class="bi bi-calendar3"></i>
            Visit Date 5
          </p>

          <input
            type="date"
            id="visitDate5"
          >


          <p class="city-label">
            <i class="bi bi-geo-alt"></i>
            Visit City 5
          </p>

          <input
            type="text"
            id="visitCity5"
            placeholder="例：New York"
            maxlength="100"
          >

        </div>


      </div>



      <!-- =========================
           Food
      ========================== -->

      <div class="text-field">

        <h3>
          <i class="bi bi-fork-knife"></i>
          Food
        </h3>

        <textarea
          id="food"
          maxlength="300"
        ></textarea>

      </div>



      <!-- =========================
           Memory
      ========================== -->

      <div class="text-field">

        <h3>
          <i class="bi bi-image"></i>
          Memory
        </h3>

        <textarea
          id="memory"
          maxlength="300"
        ></textarea>

      </div>



      <!-- =========================
           Memo
      ========================== -->

      <div class="text-field">

        <h3>
          <i class="bi bi-sticky"></i>
          Memo
        </h3>

        <textarea
          id="memo"
          maxlength="300"
        ></textarea>

      </div>



      <!-- =========================
           保存ボタン
      ========================== -->

      <button id="saveButton">

        <i class="bi bi-floppy"></i>
        保存

      </button>


    </section>


  </div>


  <!-- 自分のJavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>


</body>

</html>

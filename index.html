<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Yochan Travel Map</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

</head>

<body>

  <div class="container">

    <h1>Yochan Travel Map</h1>

    <h2>Countries Visited</h2>

    <div id="map"></div>

    <h2>Travel Memories</h2>

    <h3 id="selected-country">
    Select a country on the map
    </h3>

    <p>Visit Date 1</p>
    <input type="date" id="visitDate1">

    <p>Visit Date 2</p>
    <input type="date" id="visitDate2">

    <p>Visit Date 3</p>
    <input type="date" id="visitDate3">

    <p>Visit Date 4</p>
    <input type="date" id="visitDate4">

    <p>Visit Date 5</p>
    <input type="date" id="visitDate5">

    <h3>Food</h3>
    <textarea id="food" maxlength="800"></textarea>

    <h3>Memory</h3>
    <textarea id="memory" maxlength="800"></textarea>

    <h3>Memo</h3>
    <textarea id="memo" maxlength="800"></textarea>

    <button id="saveButton">
    保存
    </button>

  </div>

  <script src="app.js"></script>

</body>

</html>
